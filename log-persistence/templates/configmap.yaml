apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "log-persistence.fullname" . }}-config
  labels:
    {{- include "log-persistence.labels" . | nindent 4 }}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     {{ .Values.buffering.flushInterval }}
        Log_Level                 info
        Daemon                    off
        Parsers_File              parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 {{ .Values.monitoring.healthPort }}
        Health_Check              On
        storage.path              /tmp/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 5M
        storage.metrics           on

    {{- if .Values.monitoring.enabled }}
    [INPUT]
        Name              prometheus_scrape
        Tag               prometheus
        Host              0.0.0.0
        Port              {{ .Values.monitoring.healthPort }}
        Metrics_path      /api/v1/metrics/prometheus
    {{- end }}

    [INPUT]
        Name                tail
        Tag                 kube.*
        Path                /var/log/containers/*.log
        Exclude_Path        /var/log/containers/*_kube-system_*.log,/var/log/containers/*_kube-public_*.log
        multiline.parser    docker, cri
        DB                  /tmp/flb.db
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Skip_Empty_Lines    On
        Refresh_Interval    10
        storage.type        filesystem

    {{- if .Values.logging.enrichment.enabled }}
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        {{- if .Values.logging.enrichment.annotations }}
        Annotations         On
        {{- end }}
        Buffer_Size         {{ .Values.buffering.bufferSize }}
    {{- end }}

    # Filter to only include logs from specified namespaces
    [FILTER]
        Name    grep
        Match   kube.*
        Regex   kubernetes.namespace_name {{ join "|" .Values.logging.namespaces }}

    {{- if .Values.logging.parsing.enabled }}
    # Parse JSON logs from fugue-state-ui
    [FILTER]
        Name    parser
        Match   kube.*fugue-state-ui*
        Key_Name log
        Parser  fugue_state_json
        Reserve_Data On
        Preserve_Key On
    {{- end }}

    # Add timestamp and hostname
    [FILTER]
        Name    record_modifier
        Match   *
        Record  hostname ${HOSTNAME}
        Record  cluster fugue-state

    # Output to S3
    [OUTPUT]
        Name                          s3
        Match                         *
        bucket                        {{ .Values.s3.bucket }}
        region                        {{ .Values.s3.region }}
        endpoint                      {{ .Values.s3.endpoint }}
        use_put_object                On
        total_file_size               {{ .Values.buffering.s3TotalFileSize }}
        upload_timeout                10m
        upload_chunk_size             {{ .Values.buffering.s3UploadChunkSize }}
        store_dir                     /tmp/s3
        s3_key_format                 /{{ .Values.s3.pathPrefix }}/%Y/%m/%d/$TAG[2]/%Y%m%d_%H%M%S_$UUID.gz
        s3_key_format_tag_delimiters  .
        auto_retry_requests           On
        retry_limit                   {{ .Values.buffering.maxRetries }}
        store_dir_limit_size          2G
        compression                   gzip

    {{- if .Values.monitoring.enabled }}
    # Output metrics to stdout for debugging
    [OUTPUT]
        Name   stdout
        Match  prometheus
        Format json_lines
    {{- end }}

  parsers.conf: |
    [PARSER]
        Name   apache
        Format regex
        Regex  ^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name   apache2
        Format regex
        Regex  ^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^ ]*) +\S*)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name   apache_error
        Format regex
        Regex  ^\[[^ ]* (?<time>[^\]]*)\] \[(?<level>[^\]]*)\](?: \[pid (?<pid>[^\]]*)\])?( \[client (?<client>[^\]]*)\])? (?<message>.*)$

    [PARSER]
        Name   nginx
        Format regex
        Regex ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name   json
        Format json
        Time_Key time
        Time_Format %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name         docker
        Format       json
        Time_Key     time
        Time_Format  %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep    On

    [PARSER]
        Name          cri
        Format        regex
        Regex         ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
        Time_Key      time
        Time_Format   %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep     On

    # Custom parser for fugue-state-ui JSON logs
    [PARSER]
        Name         fugue_state_json
        Format       json
        Time_Key     {{ .Values.logging.parsing.timeKey }}
        Time_Format  {{ .Values.logging.parsing.timeFormat }}
        Time_Keep    On
