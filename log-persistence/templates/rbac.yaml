apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "log-persistence.fullname" . }}
  labels:
    {{- include "log-persistence.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - pods
  - pods/logs
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "log-persistence.fullname" . }}
  labels:
    {{- include "log-persistence.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "log-persistence.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "log-persistence.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
