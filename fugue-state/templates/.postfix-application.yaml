apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postfix
  namespace: argocd
spec:
  destination:
    namespace: postfix
    server: "https://kubernetes.default.svc"
  project: fugue-state
  source:
    path: postfix
    repoURL: "https://github.com/fugue-state-io/helm-charts"
    targetRevision: develop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
