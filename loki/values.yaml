deploymentMode: SingleBinary

loki:
  auth_enabled: false

  storage:
    type: s3
    s3:
      bucketnames: fugue-state-backend
      region: nyc3
      endpoint: https://nyc3.digitaloceanspaces.com
      s3forcepathstyle: true
      insecure: false

  schemaConfig:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: s3
        schema: v11
        index:
          prefix: index_
          period: 24h

  compactor:
    working_directory: /loki/compactor
    shared_store: s3

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 168h

  chunk_store_config:
    max_look_back_period: 168h

  table_manager:
    retention_deletes_enabled: true
    retention_period: 168h

extraEnvFrom:
  - secretRef:
      name: loki-s3-credentials

# Persistence for compactor state (optional but recommended)
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: "do-block-storage"

# Expose Loki via a service (can add ingress separately)
service:
  type: ClusterIP
  port: 3100
