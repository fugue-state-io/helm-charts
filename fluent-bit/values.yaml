kind: Deployment  # NOT DaemonSet
rbac:
  create: true

service:
  type: ClusterIP
  port: 2020  # HTTP input port

input:
  enabled: true
  name: http
  tag: http.logs

filter:
  enabled: true
  name: stdout  # optional, just shows output in pod logs

output:
  enabled: true
  name: loki
  match: "*"
  host: loki.default.svc.cluster.local
  port: 3100
  http_user: ""
  http_passwd: ""
  tls: off

resources:
  limits:
    memory: 200Mi
    cpu: 200m
  requests:
    memory: 100Mi
    cpu: 100m
