apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "postfix.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "postfix.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  main.cf.template: |
    myhostname = {{ .Values.config.postfix.myhostname }}
    mydomain = fugue-state.io
    myorigin = $mydomain

    relayhost = [${SMTP_SERVER}]:587
    smtp_use_tls = yes
    smtp_sasl_auth_enable = yes
    smtp_sasl_password_maps = static:${SMTP_USER}:${SMTP_PASSWORD}
    smtp_sasl_security_options = noanonymous
    smtp_sasl_tls_security_options = noanonymous
    smtp_tls_CAfile = /etc/ssl/certs/ca-certificates.crt

    inet_interfaces = all
    inet_protocols = all

  entrypoint.sh: |
    #!/bin/sh
    set -e
    echo "Generating main.cf from template..."
    envsubst < /etc/postfix/main.cf.template > /etc/postfix/main.cf
    echo "Generated main.cf:"
    cat /etc/postfix/main.cf
    echo "Starting Postfix..."
    exec "$@"
