apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fugue-state-ui.fullname" . }}
  labels:
    {{- include "fugue-state-ui.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fugue-state-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        reloader.stakater.com/match: "true"
        # Annotations for log parsing
        fluentbit.io/parser: "fugue_state_json"
        fluentbit.io/exclude: "false"
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fugue-state-ui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fugue-state-ui.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: {{ .Values.initContainer.name }}
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.initContainer.image.pullPolicy }}
          volumeMounts:
            {{- toYaml .Values.initContainer.volumeMounts | nindent 12 }}
          resources:
            {{- toYaml .Values.initContainer.resources | nindent 12 }}
          envFrom:
          - secretRef:
              name: fugue-state-ui-secrets
          env:
          - name: NEXT_PUBLIC_VERSION
            value: "{{ .Values.image.tag }}"
          - name: NEXT_TELEMETRY_DISABLED
            value: "{{ .Values.nextTelemetryDisabled}}"
          # Logging configuration
          - name: LOG_STRUCTURED
            value: "{{ .Values.logging.structured }}"
          - name: LOG_LEVEL
            value: "{{ .Values.logging.level }}"
          - name: LOG_REQUEST_ENABLED
            value: "{{ .Values.logging.requestLogging }}"
          - name: LOG_SECURITY_ENABLED
            value: "{{ .Values.logging.securityLogging }}"
      volumes:
        - name: application-volume
          emptyDir: {}
      containers:
        - name: {{ .Chart.Name }}
          volumeMounts:
          - name: application-volume
            mountPath: /application
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 30
            httpGet:
              path: /
              port: http
          readinessProbe:
            initialDelaySeconds: 15
            timeoutSeconds: 30
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
          - secretRef:
              name: fugue-state-ui-secrets
          env:
          - name: NEXT_PUBLIC_VERSION
            value: "{{ .Values.image.tag }}"
          - name: NEXT_TELEMETRY_DISABLED
            value: "{{ .Values.nextTelemetryDisabled}}"
          # Logging configuration
          - name: LOG_STRUCTURED
            value: "{{ .Values.logging.structured }}"
          - name: LOG_LEVEL
            value: "{{ .Values.logging.level }}"
          - name: LOG_REQUEST_ENABLED
            value: "{{ .Values.logging.requestLogging }}"
          - name: LOG_SECURITY_ENABLED
            value: "{{ .Values.logging.securityLogging }}"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
