apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-agent
  namespace: argocd
spec:
  project: fugue-state
  destination:
    namespace: loki
    server: https://kubernetes.default.svc
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana-agent
    targetRevision: 0.42.0
    helm:
      values: |
        installCRDs: true
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
