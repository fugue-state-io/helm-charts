loki:
  enabled: true

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.loki-stack.svc.cluster.local:3100/loki/api/v1/push

grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: ClusterIP
