{{- if .Values.predeploy.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fugue-state-ui.fullname" . }}-predeploy
  labels:
    {{- include "fugue-state-ui.labels" . | nindent 4 }}
spec:
  template:
    spec:
      containers:
        - name: predeploy
          image: "{{ .Values.predeploy.image.repository }}:{{ .Values.predeploy.image.tag }}"
          imagePullPolicy: {{ .Values.predeploy.image.pullPolicy }}
          command: {{ .Values.predeploy.command }}
          args: {{ .Values.predeploy.args }}
          volumeMounts:
            {{- toYaml .Values.predeploy.volumeMounts | nindent 12 }}
          resources:
            {{- toYaml .Values.predeploy.resources | nindent 12 }}
      restartPolicy: OnFailure
      volumes:
        {{- toYaml .Values.volumes | nindent 8 }}
{{- end }}
