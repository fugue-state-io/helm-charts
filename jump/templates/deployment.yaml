apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ssh-jumpbox.fullname" . }}
  labels:
    app: {{ include "ssh-jumpbox.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "ssh-jumpbox.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "ssh-jumpbox.name" . }}
    spec:
      initContainers:
        - name: copy-ssh-keys
          image: busybox
          command: ["sh", "-c", "mkdir -p /mnt/shared/ssh/authorized_keys && cp /mnt/secrets/id_rsa.pub /mnt/shared/ssh/authorized_keys/{{ .Values.ssh.user }}"]
          volumeMounts:
            - name: ssh-keys
              mountPath: /mnt/secrets
              readOnly: true
            - name: ssh-config
              mountPath: /mnt/shared
      containers:
        - name: jumpbox
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 2222
              name: ssh
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: USER_NAME
              value: "{{ .Values.ssh.user }}"
            - name: PUBLIC_KEY_DIR
              value: "/config/ssh"
          volumeMounts:
            - name: ssh-config
              mountPath: /config/ssh
      volumes:
        - name: ssh-keys
          secret:
            secretName: {{ .Values.ssh.secretName }}
        - name: ssh-config
          emptyDir: {}