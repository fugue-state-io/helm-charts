apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: react-pong-client
  namespace: argocd
spec:
  destination:
    namespace: go-pong
    server: "https://kubernetes.default.svc"
  project: go-pong
  source:
    helm:
      passCredentials: false
    path: react-pong-client
    repoURL: "https://github.com/fugue-state-io/helm-charts"
    targetRevision: develop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
