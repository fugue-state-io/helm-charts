loki:
  auth_enabled: false

  storage:
    type: s3
    s3:
      bucketnames: fugue-state-backend
      region: nyc3
      endpoint: https://nyc3.digitaloceanspaces.com  # or your S3-compatible endpoint
      s3forcepathstyle: true
      insecure: false

  schemaConfig:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: s3
        schema: v11
        index:
          prefix: index_
          period: 24h

  compactor:
    working_directory: /loki/compactor
    shared_store: s3

  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  chunk_store_config:
    max_look_back_period: 168h

  table_manager:
    retention_deletes_enabled: true
    retention_period: 168h

singleBinary:
  replicas: 1
  enabled: true

backend:
  enabled: false
read:
  enabled: false
write:
  enabled: false

extraEnvFrom:
  - secretRef:
      name: loki-s3-credentials
