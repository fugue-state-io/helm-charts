apiVersion: v1
kind: Secret
metadata:
  name: {{ include "log-persistence.fullname" . }}-s3-credentials
  labels:
    {{- include "log-persistence.labels" . | nindent 4 }}
type: Opaque
data:
  # These values should be provided during deployment
  # Either via --set-string or values.yaml override
  access-key-id: {{ required "S3 access key ID is required" .Values.s3.accessKeyId | b64enc | quote }}
  secret-access-key: {{ required "S3 secret access key is required" .Values.s3.secretAccessKey | b64enc | quote }}
